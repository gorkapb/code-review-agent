# All config lives in .env (the single source of truth), shared by the api,
# worker, and migrate services. Mirrors the api + worker split we run on Railway.
x-app-base: &app-base
  build: .
  env_file: .env
  # Map host.docker.internal to the host gateway so containers can reach services
  # on the host — e.g. self-hosted Langfuse on :3000 (LANGFUSE_BASE_URL in .env).
  # Needed on Linux; a no-op on Docker Desktop where it already resolves.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # One-shot: owns the schema, same as Railway's preDeployCommand. The api
  # and worker wait for this to finish so they never race to migrate.
  migrate:
    <<: *app-base
    command: uv run alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app-base
    ports:
      - "8000:8000"
    depends_on: &app-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-base
    command: uv run arq src.worker.worker.WorkerSettings
    depends_on: *app-deps

  # On-demand admin tool: create a tenant + API key against the running stack.
  # Kept out of `docker compose up` by the "tools" profile.
  #   docker compose run --rm create-tenant "My Company"
  create-tenant:
    <<: *app-base
    profiles: ["tools"]
    entrypoint: ["uv", "run", "python", "scripts/create_tenant.py"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-code_review}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
